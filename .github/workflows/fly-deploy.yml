name: Deploy to Fly.io

# Runs after "Optimize Images" finishes, so the deploy always ships the
# converted/renumbered images rather than the raw push. Note that the
# optimizer's own commit uses GITHUB_TOKEN and so cannot re-trigger a push
# event — this workflow_run chain is what keeps the two in order.
on:
  workflow_run:
    workflows: ["Optimize Images"]
    branches:
      - main
    types:
      - completed

# Cancel an in-progress deploy if a newer push arrives.
concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Take the branch tip, not the workflow_run's head SHA — the tip
          # includes the optimizer's commit.
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
