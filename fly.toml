# fly.toml — Fly.io deployment config for foxgirls.download
# Run `fly launch --no-deploy` once to set/confirm the app name, then `fly deploy`.

app = "foxgirls-download"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
