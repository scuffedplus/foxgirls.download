server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip text assets.
    gzip on;
    gzip_types text/css text/html image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache images aggressively — they're content-addressed by filename.
    location /images/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
